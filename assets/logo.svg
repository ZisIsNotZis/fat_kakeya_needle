    <rect x="16" y="59" width="96" height="10" rx="5" fill="url(#needle)"/>
    <circle cx="109" cy="64" r="3.5" fill="#38bdf8"/>
  </g>
  <circle cx="64" cy="64" r="4" fill="#0b1220" stroke="#7dd3fc" stroke-width="2"/>
